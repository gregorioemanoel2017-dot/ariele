<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma coisinha pra você ✨</title>

<style>
body {
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(to bottom, #ffe6f0, #fff0f5);
    padding: 20px;
}

h1 {
    color: #ff4d88;
    font-size: 22px;
}

img {
    width: 90%;
    max-width: 300px;
    margin: 10px 0;
    border-radius: 15px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
}

button {
    width: 90%;
    max-width: 300px;
    padding: 14px;
    margin: 8px 0;
    border: none;
    border-radius: 25px;
    background-color: #ff66a3;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:active {
    transform: scale(0.97);
}

.mensagem {
    display: none;
    margin: 15px 0;
    font-size: 16px;
    color: #99004d;
    line-height: 1.6;
    animation: fade 0.8s ease-in-out;
}

@keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>

<script>
function mostrar(id) {
    var elemento = document.getElementById(id);
    if (elemento.style.display === "block") {
        elemento.style.display = "none";
    } else {
        elemento.style.display = "block";
    }
}
</script>

</head>

<body>

<h1>Fiz isso sorrindo… só porque lembrei de você ✨</h1>

<img src="foto1.jpeg">
<img src="foto2.jpeg">
<img src="foto3.jpeg">
<img src="foto4.jpeg">
<img src="foto5.jpeg">

<button onclick="document.getElementById('musica').play()">
🎵 Aperta aqui
</button>

<audio id="musica" preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<button onclick="mostrar('m1')">🌸 Poesia 1</button>
<div id="m1" class="mensagem">
Ariele, há pessoas que passam como vento...<br>
(permanecer igual você colocou)
</div>

<!-- Repete para as outras poesias -->
<!-- (Cole as outras poesias aqui igual já fizemos antes) -->

</body>

</html>
